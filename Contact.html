<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url('bg1.jpg')no-repeat center center/cover;
            text-align: center;
        }
        header {
            background: #444;
            color: white;
            padding: 15px;
        }
        .content {
            padding: 20px;
        }
        form {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background: #444;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
        footer {
            background: #444;
            color: white;
            padding: 10px;
            position: absolute;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    
    <section class="content">
        <h2 style="color: aliceblue;">Get in Touch</h2>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your email" required>
            <input type="text" placeholder="Your address" required>
            <textarea placeholder="Name of candies" rows="2" required></textarea>
            <button type="submit">Order now</button>
        </form>
    
    <div class="contact-details" style="color: blanchedalmond;">
        <p>Email: contact@Candycarousel.com</p>
        <p>Phone: +123 456 7890</p>
        <p>Address: 123 Main Street, Chennai, India</p>
    </div>
</section>
    <footer>
        <p>&copy; 2025 Candycarousel. All rights reserved.</p>
    </footer>
</body>
</html>
